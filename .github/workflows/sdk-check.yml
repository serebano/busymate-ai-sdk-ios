name: SDK checks
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the package and importing sample
        run: bash scripts/check-ios.sh
      - name: Build the real example app
        run: bash example-app/scripts/build.sh
      - name: Test configuration and backend reply boundaries
        run: bash example-app/scripts/test-config.sh
      - name: Run actual demo on an isolated iOS Simulator
        run: bash example-app/scripts/test-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-runtime-results
          path: example-app/.runtime-results/
          retention-days: 7
