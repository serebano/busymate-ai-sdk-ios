name: SDK checks
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_commit:
        description: 'Verified live native-chat commit (leave both inputs empty for ordinary smoke)'
        required: false
        type: string
      hosted_build:
        description: 'Matching verified live build number; enables real OS grant/deny acceptance'
        required: false
        type: string
permissions:
  contents: read
jobs:
  sdk-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require the declared native-chat live revision before permission acceptance
        if: github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        env:
          BUSYMATE_HOSTED_COMMIT: ${{ inputs.hosted_commit }}
          BUSYMATE_HOSTED_BUILD: ${{ inputs.hosted_build }}
        run: python3 scripts/assert-hosted-release.py "$RUNNER_TEMP/native-permission-live-guard.json"
      - name: Build the package and importing sample
        run: bash scripts/check-ios.sh
      - name: Build the real example app
        run: bash example-app/scripts/build.sh
      - name: Test configuration and backend reply boundaries
        run: bash example-app/scripts/test-config.sh
      - name: Run actual demo on an isolated iOS Simulator
        if: github.event_name != 'workflow_dispatch' || (inputs.hosted_commit == '' && inputs.hosted_build == '')
        run: bash example-app/scripts/test-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.hosted_commit == '' && inputs.hosted_build == ''))
        with:
          name: ios-native-runtime-results
          include-hidden-files: true
          path: example-app/.runtime-results/
          retention-days: 7
      - name: Verify first-tap OS permission against the confirmed live build
        if: github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        env:
          BUSYMATE_HOSTED_COMMIT: ${{ inputs.hosted_commit }}
          BUSYMATE_HOSTED_BUILD: ${{ inputs.hosted_build }}
        run: bash example-app/scripts/test-permissions.sh
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.hosted_commit != '' || inputs.hosted_build != '')
        with:
          name: ios-first-tap-permission-results
          include-hidden-files: true
          path: example-app/.permission-results/
          retention-days: 7
